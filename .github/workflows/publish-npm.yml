name: Publish to NPM

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Assert tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
      - name: Skip if this version is already on npm
        id: check
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "@omarshahine/homebridge-eight-sleep@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "Version $PKG_VERSION already published; skipping"
            echo "already=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.already != 'true'
        run: npm publish --provenance --access public
      - run: npm view @omarshahine/homebridge-eight-sleep version
